name: CI

# Offline CI: unit tests + eval runners. No paid API calls, no secrets used.
on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege; never expose secrets to untrusted pull requests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Dev eval (mock, offline)
        run: python eval/run_eval.py
      - name: Regression eval (mock, offline)
        run: python eval/run_regression.py
